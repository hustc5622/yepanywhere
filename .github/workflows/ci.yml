name: Inspector polling audit pilot
on:
  push:
    branches: [audit/architecture-7ae1af2e-20260920]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ae1af2e8fcd9d3ca30e3da76207b802778138aa
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install immutable baseline dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pilot"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/pilot/install.log"
      - name: Add focused regression tests without changing production code
        shell: bash
        run: |
          cat > packages/client/src/components/__tests__/SessionInspector.polling.test.tsx <<'TEST'
          import { act, cleanup, fireEvent, render, screen } from "@testing-library/react";
          import { MemoryRouter } from "react-router-dom";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { api } from "../../api/client";
          import { I18nProvider } from "../../i18n";
          import { UI_KEYS } from "../../lib/storageKeys";
          import { SessionInspector } from "../SessionInspector";

          const status = {
            isGitRepo: true,
            branch: "main",
            upstream: null,
            ahead: 0,
            behind: 0,
            isClean: true,
            files: [],
          };

          function inspector(presentation: "drawer" | "sidebar", isOpen = true) {
            return (
              <MemoryRouter>
                <I18nProvider>
                  <SessionInspector
                    presentation={presentation}
                    isOpen={isOpen}
                    messages={[]}
                    projectId="project-1"
                    sessionId="session-1"
                    status={{ owner: "none" }}
                    onSelectMessage={() => {}}
                  />
                </I18nProvider>
              </MemoryRouter>
            );
          }

          async function tick(milliseconds = 0) {
            await act(async () => {
              await vi.advanceTimersByTimeAsync(milliseconds);
            });
          }

          describe("SessionInspector Git polling demand", () => {
            beforeEach(() => {
              vi.useFakeTimers();
              Object.defineProperty(document, "visibilityState", {
                configurable: true,
                value: "visible",
              });
              window.localStorage.setItem(UI_KEYS.locale, "en");
              vi.spyOn(api, "getGitStatus").mockResolvedValue(status);
            });

            afterEach(() => {
              cleanup();
              vi.useRealTimers();
              vi.restoreAllMocks();
              window.localStorage.removeItem(UI_KEYS.locale);
            });

            it("does not query Git while the mobile drawer is closed", async () => {
              render(inspector("drawer", false));
              await tick(60_000);
              console.log("closed-drawer Git requests / 60s", vi.mocked(api.getGitStatus).mock.calls.length);
              expect(api.getGitStatus).not.toHaveBeenCalled();
            });

            it("does not query Git while a different inspector tab is active", async () => {
              render(inspector("sidebar"));
              await tick(60_000);
              console.log("questions-tab Git requests / 60s", vi.mocked(api.getGitStatus).mock.calls.length);
              expect(api.getGitStatus).not.toHaveBeenCalled();
            });

            it("fetches on entering Git, polls there, and stops after leaving", async () => {
              render(inspector("sidebar"));
              fireEvent.click(screen.getByRole("tab", { name: "Git" }));
              await tick();
              expect(api.getGitStatus).toHaveBeenCalledTimes(1);
              await tick(10_000);
              expect(api.getGitStatus).toHaveBeenCalledTimes(3);
              fireEvent.click(screen.getByRole("tab", { name: "Questions" }));
              await tick(15_000);
              expect(api.getGitStatus).toHaveBeenCalledTimes(3);
            });

            it("stops a selected Git tab on drawer close and refreshes on reopen", async () => {
              const view = render(inspector("drawer"));
              fireEvent.click(screen.getByRole("tab", { name: "Git" }));
              await tick();
              expect(api.getGitStatus).toHaveBeenCalledTimes(1);
              view.rerender(inspector("drawer", false));
              await tick(15_000);
              expect(api.getGitStatus).toHaveBeenCalledTimes(1);
              view.rerender(inspector("drawer", true));
              await tick();
              expect(api.getGitStatus).toHaveBeenCalledTimes(2);
              view.unmount();
              await tick(15_000);
              expect(api.getGitStatus).toHaveBeenCalledTimes(2);
            });
          });
          TEST
          pnpm exec biome format --write packages/client/src/components/__tests__/SessionInspector.polling.test.tsx
      - name: Negative control must fail on original production code
        id: negative
        shell: bash
        run: |
          set +e
          pnpm --filter @yep-anywhere/client test src/components/__tests__/SessionInspector.polling.test.tsx 2>&1 | tee "$RUNNER_TEMP/pilot/negative-control.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$RUNNER_TEMP/pilot/negative-exit-code.txt"
          test "$result" -ne 0
          grep -F 'actually been called 13 times' "$RUNNER_TEMP/pilot/negative-control.log"
      - name: Apply single-boundary workload reduction
        if: steps.negative.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/client/src/components/SessionInspector.tsx')
          text=p.read_text()
          old='} = useGitStatus(projectId);'
          assert text.count(old)==1
          p.write_text(text.replace(old,'} = useGitStatus(isOpen && activeTab === "git" ? projectId : undefined);'))
          PY
          git add -N packages/client/src/components/__tests__/SessionInspector.polling.test.tsx
          git diff --check
          git diff > "$RUNNER_TEMP/pilot/inspector-demand-polling.patch"
          git diff --stat > "$RUNNER_TEMP/pilot/change-stat.txt"
      - name: Focused positive control
        id: positive
        shell: bash
        run: pnpm --filter @yep-anywhere/client test src/components/__tests__/SessionInspector.polling.test.tsx 2>&1 | tee "$RUNNER_TEMP/pilot/positive-control.log"
      - name: Lint and typecheck
        id: checks
        shell: bash
        run: |
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/pilot/lint.log"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/pilot/typecheck.log"
      - name: Full existing non-browser test suite
        id: tests
        shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/pilot/test.log"
      - name: Save outcome
        if: always()
        run: |
          printf '%s\n' 'base=7ae1af2e8fcd9d3ca30e3da76207b802778138aa' 'negative=${{ steps.negative.outcome }}' 'positive=${{ steps.positive.outcome }}' 'checks=${{ steps.checks.outcome }}' 'tests=${{ steps.tests.outcome }}' > "$RUNNER_TEMP/pilot/outcomes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspector-polling-pilot-7ae1af2e
          path: ${{ runner.temp }}/pilot
          retention-days: 7
