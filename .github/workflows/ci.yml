name: Architecture audit 7ae1af2e
on:
  push:
    branches: [audit/architecture-7ae1af2e-20260920]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_BASE_SHA: 7ae1af2e8fcd9d3ca30e3da76207b802778138aa
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ae1af2e8fcd9d3ca30e3da76207b802778138aa
          persist-credentials: false
          fetch-depth: 310
      - name: Capture immutable source and history
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source" "$RUNNER_TEMP/audit-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/BASE_SHA.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/audit-source/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/audit-source/tree.txt"
          git log -300 --format='COMMIT %H %cI %s' --name-only > "$RUNNER_TEMP/audit-source/history-300.txt"
          cd "$RUNNER_TEMP/audit-source"
          sha256sum source.tar.gz > source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-source-7ae1af2e
          path: ${{ runner.temp }}/audit-source
          retention-days: 7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependency installation
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { node --version; pnpm --version; uname -a; } > "$RUNNER_TEMP/audit-evidence/environment.txt"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/audit-evidence/install.log"
      - name: Full tracked-file TypeScript AST scan
        if: steps.install.outcome == 'success'
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/scan.cjs" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const {createRequire}=require('node:module');
          const root=process.cwd(),req=createRequire(path.join(root,'package.json')),ts=req('typescript');
          const out=path.join(process.env.RUNNER_TEMP,'audit-evidence','static');fs.mkdirSync(out,{recursive:true});
          const all=cp.execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean).sort(),set=new Set(all);
          function category(p,text=''){
            if(/codex-protocol\/(generated|schema)\//.test(p)||/\.pb\.go$/.test(p)||/^\/\/.*(?:Code generated|AUTOGENERATED|auto-generated)/im.test(text.slice(0,1600)))return 'generated';
            if(/_test\.go$/.test(p)||/(^|\/)(test|tests|__tests__|e2e|fixtures|__mocks__)(\/|$)|\.(test|spec)\.[cm]?[jt]sx?$/.test(p))return 'test';
            if(/\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|go|rs|kt|java|swift|m)$/.test(p))return 'source';
            if(/\.(md|txt)$/.test(p))return 'documentation';return 'other';
          }
          function resolve(from,spec){
            if(spec==='@yep-anywhere/shared')return 'packages/shared/src/index.ts';let base;
            if(spec.startsWith('@/'))base='packages/server/src/'+spec.slice(2);
            else if(spec.startsWith('.'))base=path.posix.normalize(path.posix.join(path.posix.dirname(from),spec));else return null;
            for(const p of [base,base.replace(/\.js$/,'.ts'),base.replace(/\.js$/,'.tsx'),base+'.ts',base+'.tsx',base+'.js',base+'/index.ts',base+'/index.tsx',base+'/index.js'])if(set.has(p))return p;return null;
          }
          const inventory=[],edges=[],symbols=[],parseErrors=[],clones=new Map(),hashMismatches=[];
          const tree=cp.execFileSync('git',['ls-tree','-rz','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const hashes=new Map(tree.map(r=>{const n=r.indexOf('\t');return[r.slice(n+1),r.slice(0,n).split(' ')[2]];}));
          for(const file of all){
            if(!fs.statSync(file).isFile())continue;
            const bytes=fs.readFileSync(file),text=bytes.toString('utf8'),cat=category(file,text);
            const blob=crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
            if(blob!==hashes.get(file))hashMismatches.push(file);
            const lines=bytes.length?text.split('\n').length-(text.endsWith('\n')?1:0):0;
            inventory.push({path:file,category:cat,bytes:bytes.length,lines,gitBlob:blob,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});
            if(!/\.[cm]?[jt]sx?$/.test(file))continue;
            const sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true);
            for(const d of sf.parseDiagnostics)parseErrors.push({file,start:d.start,message:ts.flattenDiagnosticMessageText(d.messageText,' ')});
            const line=(n,end=false)=>sf.getLineAndCharacterOfPosition(end?n.end:n.getStart(sf)).line+1;
            const add=(spec,node,kind,typeOnly)=>edges.push({from:file,to:resolve(file,spec),specifier:spec,kind,typeOnly,line:line(node)});
            function visit(node){
              if(ts.isImportDeclaration(node)&&ts.isStringLiteral(node.moduleSpecifier)){
                const cl=node.importClause;let only=!!cl?.isTypeOnly;
                if(cl&&!cl.name&&cl.namedBindings&&ts.isNamedImports(cl.namedBindings)&&cl.namedBindings.elements.length&&cl.namedBindings.elements.every(e=>e.isTypeOnly))only=true;
                add(node.moduleSpecifier.text,node,'import',only);
              }else if(ts.isExportDeclaration(node)&&node.moduleSpecifier&&ts.isStringLiteral(node.moduleSpecifier)){
                let only=!!node.isTypeOnly;
                if(node.exportClause&&ts.isNamedExports(node.exportClause)&&node.exportClause.elements.length&&node.exportClause.elements.every(e=>e.isTypeOnly))only=true;
                add(node.moduleSpecifier.text,node,'export',only);
              }else if(ts.isCallExpression(node)&&node.arguments.length&&ts.isStringLiteral(node.arguments[0])){
                if(node.expression.kind===ts.SyntaxKind.ImportKeyword)add(node.arguments[0].text,node,'dynamic',false);
                else if(ts.isIdentifier(node.expression)&&node.expression.text==='require')add(node.arguments[0].text,node,'require',false);
              }else if(ts.isImportEqualsDeclaration(node)&&ts.isExternalModuleReference(node.moduleReference)&&node.moduleReference.expression&&ts.isStringLiteral(node.moduleReference.expression)){
                add(node.moduleReference.expression.text,node,'import-equals',!!node.isTypeOnly);
              }else if(ts.isImportTypeNode(node)&&ts.isLiteralTypeNode(node.argument)&&ts.isStringLiteral(node.argument.literal)){
                add(node.argument.literal.text,node,'import-type',true);
              }
              if(ts.isFunctionDeclaration(node)||ts.isMethodDeclaration(node)||ts.isClassDeclaration(node)||ts.isInterfaceDeclaration(node)||ts.isTypeAliasDeclaration(node)||(ts.isVariableDeclaration(node)&&node.initializer&&(ts.isArrowFunction(node.initializer)||ts.isFunctionExpression(node.initializer)))){
                const r={file,category:cat,name:node.name?.getText(sf)||'<anonymous>',kind:ts.SyntaxKind[node.kind],start:line(node),end:line(node,true)};symbols.push(r);
                const body=node.body||node.initializer?.body;
                if(body&&cat==='source'){
                  const scanner=ts.createScanner(ts.ScriptTarget.Latest,true,ts.LanguageVariant.Standard,body.getText(sf)),toks=[];
                  while(scanner.scan()!==ts.SyntaxKind.EndOfFileToken)toks.push(scanner.getTokenText());
                  if(toks.length>=80){const h=crypto.createHash('sha256').update(toks.join('\x00')).digest('hex');if(!clones.has(h))clones.set(h,[]);clones.get(h).push({...r,tokens:toks.length,bodyStart:line(body),bodyEnd:line(body,true)});}
                }
              }ts.forEachChild(node,visit);
            }visit(sf);
          }
          const runtimeSet=new Set(inventory.filter(r=>r.category==='source'&&r.path.includes('/src/')).map(r=>r.path));
          const graph=new Map([...runtimeSet].map(k=>[k,[]]));
          for(const e of edges)if(!e.typeOnly&&e.kind!=='dynamic'&&graph.has(e.from)&&graph.has(e.to))graph.get(e.from).push(e.to);
          let idx=0;const ids=new Map(),low=new Map(),stack=[],on=new Set(),scc=[];
          function strong(v){ids.set(v,idx);low.set(v,idx++);stack.push(v);on.add(v);for(const w of graph.get(v)||[]){if(!ids.has(w)){strong(w);low.set(v,Math.min(low.get(v),low.get(w)));}else if(on.has(w))low.set(v,Math.min(low.get(v),ids.get(w)));}if(low.get(v)===ids.get(v)){const comp=[];let w;do{w=stack.pop();on.delete(w);comp.push(w);}while(w!==v);if(comp.length>1)scc.push(comp.sort());}}
          for(const v of graph.keys())if(!ids.has(v))strong(v);
          const duplicateBodies=[...clones.values()].filter(g=>new Set(g.map(s=>s.file)).size>1).sort((a,b)=>b[0].tokens-a[0].tokens);
          const summary={base:process.env.AUDIT_BASE_SHA,parserVersion:ts.version,files:inventory.length,parsedFiles:inventory.filter(r=>/\.[cm]?[jt]sx?$/.test(r.path)).length,edges:edges.length,resolvedEdges:edges.filter(e=>e.to).length,parseErrors,hashMismatches,duplicateBodyGroups:duplicateBodies.length,runtimeScc:scc,method:'tracked files; static literal imports including import-type/import-equals; exact function-body token sequences >=80; static value SCC excluding type-only/dynamic imports'};
          for(const[name,data]of Object.entries({summary,inventory,imports:edges,symbols,duplicateBodies}))fs.writeFileSync(path.join(out,name+'.json'),JSON.stringify(data,null,2));
          fs.copyFileSync(req.resolve('typescript'),path.join(process.env.RUNNER_TEMP,'audit-evidence','typescript.cjs'));
          console.log(JSON.stringify(summary,null,2));if(parseErrors.length||hashMismatches.length)process.exitCode=1;
          JS
          cp "$RUNNER_TEMP/scan.cjs" "$RUNNER_TEMP/audit-evidence/scan.cjs"
          node "$RUNNER_TEMP/scan.cjs" | tee "$RUNNER_TEMP/audit-evidence/scan.log"
      - name: Lint
        if: steps.install.outcome == 'success'
        id: lint
        continue-on-error: true
        shell: bash
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/audit-evidence/lint.log"
      - name: Typecheck
        if: steps.install.outcome == 'success'
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/audit-evidence/typecheck.log"
      - name: Unit and integration tests without browsers or real providers
        if: steps.install.outcome == 'success'
        id: test
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/audit-evidence/test.log"
      - name: Production client and TypeScript server builds
        if: steps.install.outcome == 'success'
        id: build
        continue-on-error: true
        shell: bash
        run: |
          { pnpm --filter @yep-anywhere/client build && pnpm --filter @yep-anywhere/server build; } 2>&1 | tee "$RUNNER_TEMP/audit-evidence/build.log"
          find packages/client/dist -type f -printf '%s %p\n' | sort -nr > "$RUNNER_TEMP/audit-evidence/client-build-sizes.txt"
      - name: Save outcomes
        if: always()
        run: |
          printf '%s\n' 'install=${{ steps.install.outcome }}' 'scan=${{ steps.scan.outcome }}' 'lint=${{ steps.lint.outcome }}' 'typecheck=${{ steps.typecheck.outcome }}' 'test=${{ steps.test.outcome }}' 'build=${{ steps.build.outcome }}' > "$RUNNER_TEMP/audit-evidence/outcomes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-evidence-7ae1af2e
          path: ${{ runner.temp }}/audit-evidence
          retention-days: 7
      - name: Enforce successful validation
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.scan.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
